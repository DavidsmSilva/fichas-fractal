name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Static export build: SSR output only used to capture index.html.
      # VITE_BASE_PATH keeps the app working under /<repo>/ on GitHub Pages.
      - run: bun run build
        env:
          STATIC_EXPORT: "true"
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - run: bun run scripts/static-export.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - uses: actions/deploy-pages@v4